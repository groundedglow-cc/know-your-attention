<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf7ef"><title>奇妙糖果机 · 小小游戏室</title><link rel="stylesheet" href="/game/candy/style.css"></head>
<body><header><a href="/" class="brand"><span>🎪</span> 小小游戏室</a><button id="sound-toggle" class="quiet sound-toggle" aria-label="关闭音效" aria-pressed="true">🔊</button><button id="help" class="quiet">🎈 怎么玩</button></header>
<main><section class="intro"><div><h1>奇妙糖果机<span>🍬</span></h1></div></section>
<section class="level-picker" aria-label="关卡选择"><div class="level-picker-heading"><strong>🍭 选一关，出发！</strong><span id="completion-count"></span></div><div class="level-carousel"><button id="previous-level" class="level-arrow" aria-label="上一关">❮</button><nav id="levels" aria-label="左右滑动浏览关卡"></nav><button id="following-level" class="level-arrow" aria-label="下一关">❯</button></div><div class="swipe-cue" aria-hidden="true">‹ <span>👆</span> ›</div></section>
<div class="workspace"><section class="game-panel"><div class="panel-heading"><div><span class="live-dot"></span><strong id="level-title"></strong></div><span id="progress"></span></div><div class="board-wrap"><div class="axis-top" id="columns"></div><div class="axis-left" id="rows"></div><div id="board" role="group" aria-label="糖果机棋盘"></div></div><div id="visual-hint" class="visual-hint" hidden aria-label="图画提示"></div><div id="status" role="status" aria-live="polite"></div><div class="board-actions"><button id="undo" aria-label="撤销"><span class="action-icon">↶</span><span>退一步</span></button><button id="reset" aria-label="重新开始"><span class="action-icon">🔄</span><span>再来一次</span></button><button id="hint" class="hint-button" aria-label="给我一点提示"><span id="hint-buddy" class="action-icon"></span><span>帮帮我</span></button></div><div id="win" hidden><strong>糖果送到啦！</strong><span>你让每一段管道都找到了朋友。</span><button id="next" class="primary">下一关 →</button></div></section>
<aside><section class="toolbox"><div id="palette"></div><button id="rotate" class="rotate" aria-label="顺时针旋转选中的卡片"><span class="action-icon">↻</span> 转一转 <kbd>R</kbd></button><button id="trash" class="trash" aria-label="卡片回收站，拖入卡片或选中后点击放回"><span id="basket-art"></span><div><strong>放回小盒子</strong></div></button></section></aside></div>
</main>
<dialog id="guide"><button id="close-guide" class="close" aria-label="关闭玩法说明">×</button><h2>一起试试看 🍬</h2><div id="learn-dots" aria-label="练习进度"></div><p id="learn-message" role="status" aria-live="polite"></p><div id="learn-board" aria-label="引导练习棋盘"></div><div class="learn-tools"><span id="learn-cue" aria-hidden="true"></span><button id="learn-card" aria-label="选择练习弯管"></button></div><button id="learn-replay" class="quiet" hidden aria-label="重新练习">↻</button><button id="start" class="primary" hidden>开始玩 →</button></dialog>
<script type="module" src="/game/candy/app.js"></script></body></html>
