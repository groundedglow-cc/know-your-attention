<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fff8ea">
  <title>小小游戏室 · 一起玩一会儿</title>
  <style>
    :root{--ink:#355147;--muted:#718279;--cream:#fff8ea;--paper:#fffdf7;--edge:#eadfca;--orange:#f2a55f;--green:#6eaa96;--blue:#7fa8ce;--shadow:0 8px 0 #e7dcc5,0 16px 30px #35514712}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font:18px system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}body{padding:max(18px,env(safe-area-inset-top)) 20px calc(24px + env(safe-area-inset-bottom))}a{color:inherit}button,a{touch-action:manipulation} .page{width:min(1080px,100%);margin:auto}
    .topbar{display:flex;justify-content:space-between;align-items:center}.back{color:var(--muted);font-weight:750;text-decoration:none;min-height:48px;display:inline-flex;align-items:center}.sound{width:52px;height:48px;border:0;border-radius:15px;background:#fff;box-shadow:0 4px 0 var(--edge);font-size:1.25rem}
    .hero{text-align:center;padding:clamp(32px,8vw,78px) 0 34px}.eyebrow{color:var(--orange);font-size:.82rem;font-weight:850;letter-spacing:.16em;text-transform:uppercase}.hero h1{font-size:clamp(2.25rem,6vw,4.4rem);line-height:1.05;margin:12px 0 16px;letter-spacing:-.04em}.hero p{max-width:520px;margin:auto;color:var(--muted);font-size:clamp(1rem,2vw,1.25rem);line-height:1.65}.sparkles{display:flex;justify-content:center;gap:16px;margin-bottom:10px;font-size:1.6rem}.sparkles span:nth-child(2){color:var(--orange);transform:translateY(-8px)}.sparkles span:nth-child(3){color:var(--blue)}
    .games{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:8px 0 42px}.game-card{display:flex;flex-direction:column;min-width:0;overflow:hidden;background:var(--paper);border:2px solid var(--edge);border-radius:28px;text-decoration:none;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}.game-card:hover{transform:translateY(-5px);box-shadow:0 12px 0 #e7dcc5,0 20px 35px #35514718}.game-card:active{transform:translateY(2px);box-shadow:0 4px 0 #e7dcc5}.game-art{height:190px;display:grid;place-items:center;position:relative;overflow:hidden}.game-art:before,.game-art:after{content:"";position:absolute;border-radius:50%;opacity:.45}.memory .game-art{background:#e4f3eb}.memory .game-art:before{width:190px;height:190px;background:#a8d5c0;right:-55px;top:-70px}.memory .game-art:after{width:130px;height:130px;background:#f5c6a4;left:-40px;bottom:-60px}.candy .game-art{background:#fff0df}.candy .game-art:before{width:210px;height:210px;background:#ffd096;left:-65px;top:-85px}.candy .game-art:after{width:150px;height:150px;background:#f4bbbc;right:-50px;bottom:-65px}.tic .game-art{background:#e7f0fa}.tic .game-art:before{width:200px;height:200px;background:#b7d2ed;right:-75px;top:-80px}.tic .game-art:after{width:130px;height:130px;background:#f4c994;left:-45px;bottom:-55px}.art-stack{position:relative;z-index:1;display:flex;align-items:center;gap:10px}.art-card{width:78px;height:96px;border-radius:18px;background:#fff;display:grid;place-items:center;font-size:3rem;box-shadow:0 6px 0 #d8cdb9;transform:rotate(-8deg)}.art-card+ .art-card{transform:rotate(8deg) translateY(8px)}.candy .art-stack{font-size:4.5rem;letter-spacing:5px}.candy .art-card{background:transparent;box-shadow:none;width:auto}.tic .art-stack{display:grid;grid-template-columns:repeat(3,54px);gap:8px}.tic .art-card{width:54px;height:54px;font-size:2rem;border-radius:14px;transform:none;box-shadow:0 4px 0 #d2dbe6}.card-body{padding:22px 22px 24px;display:flex;flex-direction:column;flex:1}.card-kicker{color:var(--muted);font-size:.82rem;font-weight:800;letter-spacing:.06em}.card-body h2{font-size:1.45rem;margin:8px 0 8px}.card-body p{color:var(--muted);line-height:1.55;margin:0 0 20px;font-size:.96rem}.play{margin-top:auto;display:flex;justify-content:space-between;align-items:center;color:var(--orange-dark,#c7773d);font-weight:850}.play span{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#fff0df;font-size:1.35rem}
    .note{display:flex;justify-content:center;gap:10px;align-items:center;color:var(--muted);font-size:.95rem;text-align:center}.note strong{color:var(--ink)}footer{text-align:center;color:#9aa69f;font-size:.82rem;margin-top:38px}
    @media (max-width:760px){.games{grid-template-columns:1fr;max-width:520px;margin-left:auto;margin-right:auto;gap:18px}.game-card{display:grid;grid-template-columns:140px 1fr}.game-art{height:100%;min-height:164px}.card-body{padding:18px 18px 20px}.card-body h2{font-size:1.25rem}.card-body p{font-size:.9rem;margin-bottom:14px}.art-card{width:58px;height:75px;font-size:2.4rem}.candy .art-stack{font-size:3.6rem}.tic .art-stack{grid-template-columns:repeat(3,40px);gap:5px}.tic .art-card{width:40px;height:40px;font-size:1.5rem}}
    @media (max-width:430px){body{padding-left:14px;padding-right:14px}.hero{padding-top:30px}.hero h1{font-size:2.35rem}.game-card{grid-template-columns:116px 1fr}.game-art{min-height:154px}.card-body{padding:16px 14px 18px}.card-body p{line-height:1.4}.note{align-items:flex-start;text-align:left}}
    @media (prefers-reduced-motion:reduce){.game-card{transition:none}.game-card:hover{transform:none}}
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar"><a class="back" href="/">← 返回注意力空间</a><span class="sound" aria-label="小游戏大厅没有背景音乐">🔈</span></div>
    <section class="hero"><div class="sparkles" aria-hidden="true"><span>✦</span><span>✦</span><span>✦</span></div><div class="eyebrow">PLAY · DISCOVER · GROW</div><h1>小小游戏室</h1><p>挑一个喜欢的游戏，慢慢玩一会儿。<br>没有计时，也没有输赢压力。</p></section>
    <main class="games" aria-label="游戏列表">
      <a class="game-card memory" href="/game/memory" target="_blank" rel="noopener" aria-label="打开翻翻找朋友，在新标签页中打开"><div class="game-art"><div class="art-stack"><span class="art-card">🐱</span><span class="art-card">🐱</span></div></div><div class="card-body"><span class="card-kicker">观察 · 记忆</span><h2>翻翻找朋友</h2><p>翻开两张卡片，找到一样的动物、交通工具或水果。</p><div class="play">开始配对 <span>→</span></div></div></a>
      <a class="game-card candy" href="/game/candy" target="_blank" rel="noopener" aria-label="打开奇妙糖果机，在新标签页中打开"><div class="game-art"><div class="art-stack"><span class="art-card">🍬</span><span class="art-card">🍭</span><span class="art-card">🍓</span></div></div><div class="card-body"><span class="card-kicker">旋转 · 连接</span><h2>奇妙糖果机</h2><p>转一转、拼一拼，让每一颗糖果顺利找到自己的罐子。</p><div class="play">开始拼图 <span>→</span></div></div></a>
      <a class="game-card tic" href="/game/tictactoe" target="_blank" rel="noopener" aria-label="打开动物三连棋，在新标签页中打开"><div class="game-art"><div class="art-stack"><span class="art-card">🐱</span><span class="art-card">🐾</span><span class="art-card">🐶</span><span class="art-card">🐾</span><span class="art-card">🐱</span><span class="art-card">🐾</span><span class="art-card">🐶</span><span class="art-card">🐾</span><span class="art-card">🐱</span></div></div><div class="card-body"><span class="card-kicker">轮流 · 思考</span><h2>动物三连棋</h2><p>和小动物轮流落子，连成三个就赢啦。</p><div class="play">开始下棋 <span>→</span></div></div></a>
    </main>
    <div class="note"><span>☀️</span><span><strong>适合一起玩</strong> · 手机、iPad、电脑都可以</span></div>
    <footer>每一次发现，都值得被好好庆祝。</footer>
  </div>
</body>
</html>
