<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf7ef">
  <title>动物三连棋 · 小小游戏室</title>
  <link rel="stylesheet" href="/game/tictactoe/style.css">
</head>
<body>
  <!-- 首页 -->
  <section id="home" class="screen home" aria-label="首页">
    <header class="home-header">
      <a href="/game/" class="brand">🎪 小小游戏室</a>
    </header>
    <div class="home-main">
      <h1>动物三连棋</h1>
      <p class="tagline">小猫和小狗，看看谁能连成三个</p>
      <div class="hero" aria-hidden="true">
        <div class="hero-piece" id="hero-cat"></div>
        <div class="hero-vs">VS</div>
        <div class="hero-piece" id="hero-dog"></div>
      </div>
      <div class="home-actions">
        <button id="play-computer" class="primary big">和小狗玩</button>
        <button id="play-family" class="secondary big">和家人玩</button>
      </div>
      <button id="open-settings" class="link">家长设置</button>
    </div>
  </section>

  <!-- 对局页 -->
  <section id="game" class="screen game" hidden>
    <header class="game-header">
      <button id="back" class="quiet">← 返回</button>
      <button id="sound-toggle" class="quiet" aria-label="关闭音效" aria-pressed="true">🔊</button>
    </header>

    <div class="turn" role="status" aria-live="polite">
      <div id="turn-avatar" class="avatar"></div>
      <span id="turn-text">轮到小猫啦</span>
    </div>

    <div class="board-wrap">
      <div id="board" class="board" role="group" aria-label="井字棋棋盘"></div>
      <svg id="win-line" class="win-line" aria-hidden="true"></svg>
      <div id="confetti" class="confetti" aria-hidden="true"></div>
    </div>

    <div id="result" class="result" hidden>
      <strong id="result-text"></strong>
      <div class="result-actions">
        <button id="play-again" class="primary">再玩一次</button>
        <button id="go-home" class="secondary">回首页</button>
      </div>
    </div>

    <button id="hint" class="hint">提示</button>
  </section>

  <!-- 家长设置 -->
  <dialog id="settings" class="dialog">
    <h2>家长设置</h2>
    <fieldset>
      <legend>棋盘大小</legend>
      <label><input type="radio" name="board-size" value="3" checked> 3 × 3</label>
      <label><input type="radio" name="board-size" value="4"> 4 × 4</label>
      <label><input type="radio" name="board-size" value="5"> 5 × 5</label>
    </fieldset>
    <fieldset>
      <legend>几连算赢</legend>
      <label><input type="radio" name="win-length" value="3" checked> 三个连一线</label>
      <label><input type="radio" name="win-length" value="4"> 四个连一线</label>
      <label><input type="radio" name="win-length" value="5"> 五个连一线</label>
    </fieldset>
    <fieldset>
      <legend>小狗的难度</legend>
      <label><input type="radio" name="difficulty" value="easy" checked> 轻松（随便走走）</label>
      <label><input type="radio" name="difficulty" value="challenge"> 挑战（会挡你啦）</label>
    </fieldset>
    <button id="replay-tutorial" class="secondary">重看教学</button>
    <button id="close-settings" class="primary">完成</button>
  </dialog>

  <!-- 首次教学 -->
  <dialog id="tutorial" class="dialog tutorial">
    <p id="tutorial-message" role="status" aria-live="polite">点一下空格，补成三个小猫</p>
    <div class="tutorial-board-wrap">
      <div id="tutorial-board" class="board" role="group" aria-label="教学棋盘"></div>
      <svg id="tutorial-line" class="win-line" aria-hidden="true"></svg>
    </div>
    <div class="tutorial-actions">
      <button id="tutorial-skip" class="quiet">跳过</button>
      <button id="tutorial-start" class="primary" hidden>开始玩 →</button>
    </div>
  </dialog>

  <!-- 离开确认 -->
  <dialog id="leave-confirm" class="dialog">
    <h2>还没下完呢</h2>
    <p>要离开这一局吗？</p>
    <div class="dialog-actions">
      <button id="leave-stay" class="primary">继续玩</button>
      <button id="leave-go" class="secondary">离开</button>
    </div>
  </dialog>

  <script type="module" src="/game/tictactoe/app.js"></script>
</body>
</html>
