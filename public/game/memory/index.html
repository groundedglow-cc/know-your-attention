<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8ea"><title>翻翻找朋友</title><link rel="stylesheet" href="/game/memory/style.css?v=3"><style>@media (min-width:600px){.game{gap:8px;padding-top:max(8px,env(safe-area-inset-top));padding-bottom:max(10px,env(safe-area-inset-bottom))}.game .board{width:min(100%,680px,72vh)}.game-actions{min-height:56px}.game .status{min-height:22px;margin:0;font-size:.95rem}}@media (min-width:600px) and (orientation:landscape) and (max-height:850px){.game .board{width:min(100%,640px,70vh)}.game .primary,.game .secondary{min-height:50px}.game-actions{min-height:52px}}</style></head><body>
<main id="home" class="screen home"><a class="brand" href="/game/">← 小小游戏室</a><div style="position:absolute;right:18px;top:max(14px,env(safe-area-inset-top));display:flex;gap:8px"><button data-language aria-label="切换朗读语言" aria-pressed="false" style="min-height:44px;padding:7px 11px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:.85rem">日语</button><button class="sound" data-sound aria-label="关闭音效">🔊</button></div><div class="home-content"><div class="hero-cards" aria-hidden="true"><span>🐱</span><span>🐱</span></div><h1>翻翻找朋友</h1><p>翻两张，找一样的！</p><button id="start" class="primary">开始玩</button><div class="choices"><label>主题<select id="theme"></select></label><label>难度<select id="difficulty"><option value="easy">小小挑战 · 6 张</option><option value="medium">再多一点 · 8 张</option><option value="hard">大大挑战 · 12 张</option></select></label></div><div class="home-links"><button id="parent" class="quiet">家长设置</button><button id="tutorial" class="quiet">再看一遍怎么玩</button></div></div></main>
<main id="game" class="screen game" hidden><header><button id="back" class="icon" aria-label="返回首页">←</button><div id="progress" class="progress" aria-label="配对进度"></div><div style="display:flex;align-items:center;gap:8px"><button data-language aria-label="切换朗读语言" aria-pressed="false" style="min-height:44px;padding:7px 11px;border:0;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-weight:800;font-size:.85rem">日语</button><button class="sound icon" data-sound aria-label="关闭音效">🔊</button></div></header><p id="status" class="status" role="status" aria-live="polite">翻两张，找一样的！</p><section id="board" class="board" role="group" aria-label="翻牌棋盘"></section><div class="game-actions"><button id="peek" class="secondary">👀 看一眼</button></div><section id="complete" class="complete" hidden aria-live="polite"><strong>都找到啦！</strong><div><button id="again" class="primary">再玩一次</button><button id="change" class="secondary">换一组</button></div></section></main>
<dialog id="settings"><button class="close" value="cancel" aria-label="关闭">×</button><h2>家长设置</h2><fieldset><legend>配错后看多久？</legend><label><input type="radio" name="delay" value="1200"> 1.2 秒</label><label><input type="radio" name="delay" value="1800" checked> 1.8 秒</label><label><input type="radio" name="delay" value="2500"> 2.5 秒</label></fieldset><hr><h3>我的图片主题</h3><p>图片只保存在这台设备上。</p><input id="custom-name" maxlength="18" placeholder="主题名称"><input id="custom-files" type="file" accept="image/jpeg,image/png,image/webp" multiple><p id="import-message"></p><button id="save-custom" class="secondary">保存图片主题</button><div id="custom-list"></div></dialog>
<dialog id="learn"><button class="close" value="cancel" aria-label="关闭">×</button><h2>翻两张，找一样的</h2><div class="learn-cards"><span>🐰</span><span>🐰</span></div><p>两张一样，就找到朋友啦！</p><button id="learn-start" class="primary">开始玩</button></dialog><script type="module" src="/game/memory/app.js?v=3"></script></body></html>
